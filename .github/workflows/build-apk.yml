name: Build APK

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Download Rime Ice dictionaries
        run: |
          mkdir -p .vendor
          git clone --depth 1 https://github.com/iDvel/rime-ice.git .vendor/rime-ice
          test -f .vendor/rime-ice/cn_dicts/base.dict.yaml
          test -f .vendor/rime-ice/cn_dicts/ext.dict.yaml
          test -f .vendor/rime-ice/cn_dicts/tencent.dict.yaml
          test -f .vendor/rime-ice/cn_dicts/8105.dict.yaml
          test -f .vendor/rime-ice/cn_dicts/41448.dict.yaml

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: my-android-ime-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
